name: Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]           # trigger on version tags too
  pull_request:
    branches: [main]           # build-only (no push) on PRs to validate Dockerfile
  release:
    types: [published]
  workflow_dispatch:           # allow manual trigger from Actions tab

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DH_IMAGE:   ${{ secrets.DOCKERHUB_USERNAME }}/copilot-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write          # needed to push to ghcr.io

    steps:
      # ── Checkout ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Docker metadata (tags + labels) ──────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DH_IMAGE }}
          tags: |
            # branch push → :latest
            type=raw,value=latest,enable={{is_default_branch}}
            # version tag v1.2.3 → :1.2.3, :1.2, :1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # commit SHA → :sha-abc1234
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Copilot Agent Docker
            org.opencontainers.image.description=Run GitHub Copilot CLI autonomously on any local project
            org.opencontainers.image.url=https://github.com/${{ github.repository }}

      # ── QEMU + Buildx for multi-platform builds ───────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to ghcr.io ─────────────────────────────────────
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Login to Docker Hub ───────────────────────────────────
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build (and push if not a PR) ─────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache from ghcr.io to speed up repeated builds
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max

      # ── Update Docker Hub description ────────────────────────
      - name: Update Docker Hub description
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DH_IMAGE }}
          readme-filepath: ./README.md
